<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RP2040 Key</title>
  <style>
    body { font-family: sans-serif; margin: 12px; min-width: 300px; }
    h1 { font-size: 16px; margin: 0 0 8px; }
    .row { margin: 8px 0; }
    button { margin-right: 8px; }
    #status { font-size: 12px; color: #333; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>RP2040 Password Key</h1>
  <div class="row">
    <button id="connect">Connect</button>
    <button id="manualArm">Arm Manual Popup</button>
  </div>
  <div class="row">
    <button id="requestFill">Request Fill</button>
    <button id="requestGenerate">Generate Password</button>
  </div>
  <div class="row">
    <input id="oldPin" type="password" maxlength="5" placeholder="Old PIN" />
    <input id="newPin" type="password" maxlength="5" placeholder="New PIN" />
    <button id="changePin">Change PIN</button>
  </div>
  <div class="row">
    <button id="confirmTap">Confirm Tap</button>
    <button id="confirmHold">Confirm Hold</button>
  </div>
  <div id="status">Disconnected</div>
  <script src="popup.js"></script>
</body>
</html>
